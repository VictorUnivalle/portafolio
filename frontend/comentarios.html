<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Aquí se cargará el menú -->
  
  <div id="menu"></div>

  <script>
  fetch("menu.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("menu").innerHTML = data;
      // Asigna el event listener aquí, después de cargar el menú
      const btn = document.getElementById('toggle-dark-mode');
      if (btn) {
        btn.addEventListener('click', () => {
          document.body.classList.toggle('dark-mode');
        });
      }
    });
  </script>

  <h1>Deja tu comentario</h1>
  <section>
    <form id="comentarioForm">
        <input type="email" id="correo" placeholder="Tu correo" required>
        <textarea id="comentario" placeholder="Escribe tu comentario..." required></textarea><!--En la variable id se debe colocar lo mismo que se establecio en el comentarios.js en la constante data linea 10-->
        <button type="submit">Enviar</button>
    </form>

    <h2>Comentarios Recientes</h2>
    <div id="listaComentarios"></div>

    <script src="js/comentarios.js"></script>
  </section>
</body>
</html>
